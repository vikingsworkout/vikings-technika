# Návrhy novej scény pre Cestovný okruh bez náradia (c22) – len tmavé náhľady, každá úloha hneď po dokončení
# uloží výsledok do vetvy obrazky-planov-nahlady3-vysledky, aby sa dalo vyberať priebežne.
name: obrazky-planov-nahlady3
on:
  workflow_dispatch:
  push:
    branches: [obrazky-planov-nahlady3]
permissions:
  contents: write
jobs:
  nahlad:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scene: [t1, t2, t3, t4, t5, t6]
        seed: ['5', '6']
    steps:
      - uses: actions/checkout@v4
      - name: Miesto a výkon
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          nproc ; free -g
      - name: stable-diffusion.cpp
        run: |
          git clone -q --depth 1 https://github.com/leejet/stable-diffusion.cpp sd
          cd sd && git submodule update -q --init --depth 1 ggml
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=ON > /dev/null
          cmake --build build -j"$(nproc)" --target sd-cli > /dev/null
      - name: Modely
        run: python3 .github/gen/models.py z
      - name: Náhľad
        run: |
          pip install -q numpy pillow
          python3 .github/gen/nahlad.py z ${{ matrix.scene }} ${{ matrix.seed }}
      - name: Uloženie
        run: |
          mkdir /tmp/r && cd /tmp/r && git init -q
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in $(seq 1 15); do
            if git fetch -q origin obrazky-planov-nahlady3-vysledky 2>/dev/null; then git checkout -q -f -B w FETCH_HEAD; else git checkout -q --orphan w 2>/dev/null || true; fi
            cp "$GITHUB_WORKSPACE"/out/*.jpg "$GITHUB_WORKSPACE"/out/*.png "$GITHUB_WORKSPACE"/out/*.json .
            git add -A && git commit -qm "Náhľad ${{ matrix.scene }}-${{ matrix.seed }}" || true
            git push -q origin w:obrazky-planov-nahlady3-vysledky && break
            sleep $((5 + RANDOM % 25))
          done
