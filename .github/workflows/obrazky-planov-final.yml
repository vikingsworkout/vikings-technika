# Hotové scény z vybraných náhľadov: svetlá verzia a AI zväčšenie na 928×1152.
# Výsledok ide do vetvy obrazky-planov-final-vysledky.
name: obrazky-planov-final
on:
  workflow_dispatch:
  push:
    branches: [obrazky-planov-final]
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        item: ['p12e 5', 'c3e 5']
    steps:
      - uses: actions/checkout@v4
      - name: Miesto a výkon
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          nproc ; free -g
      - name: stable-diffusion.cpp
        run: |
          git clone -q --depth 1 https://github.com/leejet/stable-diffusion.cpp sd
          cd sd && git submodule update -q --init --depth 1 ggml
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_NATIVE=ON > /dev/null
          cmake --build build -j"$(nproc)" --target sd-cli > /dev/null
      - name: Modely
        run: python3 .github/gen/models.py z
      - name: Hotová scéna
        run: |
          pip install -q numpy pillow
          python3 .github/gen/final.py ${{ matrix.item }}
      - name: Uloženie
        run: |
          mkdir /tmp/r && cd /tmp/r && git init -q
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in $(seq 1 15); do
            if git fetch -q origin obrazky-planov-final-vysledky 2>/dev/null; then git checkout -q -f -B w FETCH_HEAD; else git checkout -q --orphan w 2>/dev/null || true; fi
            cp "$GITHUB_WORKSPACE"/out/*.jpg "$GITHUB_WORKSPACE"/out/*.json "$GITHUB_WORKSPACE"/out/*-l.png .
            git add -A && git commit -qm "Hotová scéna ${{ matrix.item }}" || true
            git push -q origin w:obrazky-planov-final-vysledky && break
            sleep $((5 + RANDOM % 25))
          done
